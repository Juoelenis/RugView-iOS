name: Build IPA
on:
  workflow_dispatch:
  push:
    paths:
      - "RugView-iOS.zip"
      - ".github/workflows/ios.yml"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q RugView-iOS.zip -d ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project RugView.xcodeproj -scheme RugView \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RugView.app Payload/
          zip -qr RugView-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RugView-ipa
          path: ios/RugView-unsigned.ipa
